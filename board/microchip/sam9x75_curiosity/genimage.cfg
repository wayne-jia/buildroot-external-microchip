# Image for SD card boot on Microchip SAM9X75EB board
#
image boot.vfat {
	vfat {
		files = {
			"boot.bin",
			"at91-sam9x75_curiosity.dtb",
			"../build/linux-custom/arch/arm/boot/Image",
			"../../../buildroot-external-microchip/board/microchip/sam9x75_curiosity/logo.bmp"
		}
		}
	size = 8M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
